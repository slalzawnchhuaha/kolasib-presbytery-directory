<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Member</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="hero small-hero">
  <div class="top-bar">
    <a href="admin-directory.html" class="back-btn">← Back</a>
  </div>

  <div class="hero-content">
    <div class="logo-circle">
      <img src="logo.png.png" alt="PCI Logo">
    </div>

    <h1>Add Member</h1>
    <p>Admin Panel</p>
  </div>
</header>

<section class="programme-header">
  <div class="theme-card">

    <input id="name" class="admin-input" placeholder="Full Name">
    <input id="village" class="admin-input" placeholder="Village">
    <input id="church" class="admin-input" placeholder="Church">
    <input id="phone" class="admin-input" placeholder="Phone Number">

    <button id="saveMember" class="admin-btn">
      Save Member
    </button>

    <p id="statusMsg"></p>

  </div>
</section>

<script type="module" src="admin-add-member.js"></script>

</body>
</html>
