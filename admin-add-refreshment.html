<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Refreshment Counter</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero small-hero">

  <div class="top-bar">
    <a href="admin-refreshment.html" class="back-btn">← Back</a>
  </div>

  <div class="hero-content">
    <div class="logo-circle">
      <img src="logo.png.png" alt="PCI Logo">
    </div>

    <h1>Add Counter</h1>
    <p>Ei leh In Counter</p>
  </div>

</header>

<section class="programme-header">

  <div class="theme-card">

    <input id="counterNumber" class="admin-input"
           type="number" placeholder="Counter Number">

    <input id="location" class="admin-input"
           placeholder="Location">

    <div class="theme-card">

  <input
  type="file"
  id="photo"
  accept="image/*"
  capture="environment"
  style="display:none;">

<label
  id="choosePhoto"
  for="photo"
  class="admin-btn"
  style="display:block;text-align:center;margin-bottom:15px;cursor:pointer;">

  📷 Choose Photo

</label>
  <img
    id="photoPreview"
    style="display:none;width:100%;max-height:250px;border-radius:15px;object-fit:cover;">

  <p id="photoStatus">No photo selected.</p>

</div>

    <button id="saveCounter" class="admin-btn">
      Save Counter
    </button>

    <p id="statusMsg"></p>

  </div>

</section>

<script type="module" src="admin-add-refreshment.js"></script>

</body>
</html>
