<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Phone No. Pawimawhte</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->

    <header class="hero small-hero">

        <div class="top-bar">

            <a href="index.html" class="back-btn">
                ← Home
            </a>

        </div>

        <div class="hero-content">

            <div class="logo-circle">
                <img src="logo.png.png" alt="PCI Logo">
            </div>

            <h1>Phone No. Pawimawhte</h1>

            <p>Admin Panel</p>

        </div>

    </header>


    <!-- Admin Section -->

    <main class="admin-container">

        <div class="theme-card">

            <h2>📞 Important Contacts</h2>

            <p>
                Add and manage important contact numbers.
            </p>

        </div>


        <!-- Add Contact -->

        <div class="admin-form-card">

            <h2>➕ Add Contact</h2>

            <div class="form-group">

                <label for="contactName">
                    Name
                </label>

                <input
                    type="text"
                    id="contactName"
                    placeholder="Enter name"
                >

            </div>


            <div class="form-group">

                <label for="contactDesignation">
                    Designation
                </label>

                <input
                    type="text"
                    id="contactDesignation"
                    placeholder="Enter designation"
                >

            </div>


            <div class="form-group">

                <label for="contactPhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="contactPhone"
                    placeholder="Enter phone number"
                >

            </div>


            <button
                id="saveContact"
                class="admin-save-btn"
            >
                💾 Save Contact
            </button>


            <p id="statusMsg"></p>

        </div>


        <!-- Existing Contacts -->

        <div class="admin-form-card">

            <h2>📋 Existing Contacts</h2>

            <div id="contactsList">

                Loading contacts...

            </div>

        </div>

    </main>


    <script
        type="module"
        src="admin-contacts.js">
    </script>

</body>

</html>
