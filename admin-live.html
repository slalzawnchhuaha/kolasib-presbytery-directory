<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Live Link</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero small-hero">

  <div class="top-bar">
    <a href="admin.html" class="back-btn">← Admin</a>
  </div>

  <div class="hero-content">

    <div class="logo-circle">
      <img src="logo.png.png" alt="PCI Logo">
    </div>

    <h1>Edit Live Link</h1>
    <p>YouTube Live Stream</p>

  </div>

</header>

<section class="programme-header">

  <div class="theme-card">

    <input id="liveUrl"
           class="admin-input"
           placeholder="Paste YouTube Live URL">

    <button id="saveLive" class="admin-btn">
      Save Live Link
    </button>

    <p id="statusMsg"></p>

  </div>

</section>

<script type="module" src="admin-live.js"></script>

</body>
</html>
