
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A3D91">

<title>Kolasib Presbytery Digital Portal</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero">

<div class="overlay"></div>

<div class="hero-content">

<div class="logo-circle">✝</div>

<h1>Kolasib Presbytery</h1>

<p>Ei Leh In Department Digital Directory</p>

</div>

</header>

<section class="stats">

<div class="stat-card">
<div class="icon">👥</div>
<h2 id="totalMembers">0</h2>
<span>Members</span>
</div>

<div class="stat-card">
<div class="icon">🏘</div>
<h2 id="totalVillages">0</h2>
<span>Villages</span>
</div>

<div class="stat-card">
<div class="icon">⛪</div>
<h2 id="totalChurches">0</h2>
<span>Churches</span>
</div>

</section>

<section class="search-box">

<input id="q" placeholder="Search name, village, church or phone">

</section>

<main id="list"></main>

<nav class="bottom-nav">

<button class="active">Directory</button>
<button>Schedule</button>
<button>News</button>
<button>Downloads</button>

</nav>

<script src="app.js"></script>

</body>
</html>
