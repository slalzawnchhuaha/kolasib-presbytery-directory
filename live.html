
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Live - Kolasib Presbytery</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="hero small-hero">
        <div class="top-bar">
            <a href="index.html" class="back-btn">← Home</a>
        </div>

        <div class="hero-content">
            <div class="logo-circle">
                <img src="logo.png.png" alt="PCI Logo">
            </div>

            <h1>YouTube Live</h1>
            <p>Kolasib Presbytery Live Stream</p>
        </div>
    </header>

    <section class="programme-header">
        <div class="theme-card">

            <div style="background:#000; border-radius:18px; overflow:hidden;">
                <div style="position:relative; width:100%; aspect-ratio:16/9;">
                    <iframe
                        id="liveFrame"
                        title="Kolasib Presbytery Live Stream"
                        width="100%"
                        height="100%"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen
                        style="position:absolute; inset:0; border:0;">
                    </iframe>
                </div>
            </div>

            <p id="liveStatus" style="margin-top:15px; text-align:center;">
                Loading live stream...
            </p>

        </div>
    </section>

    <script type="module" src="live.js"></script>

</body>
</html>
