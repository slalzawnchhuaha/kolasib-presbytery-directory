<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News - Kolasib Presbytery Vawi 12-na</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="hero small-hero">

        <div class="top-bar">
            <a href="index.html" class="back-btn">← Home</a>
        </div>

        <div class="hero-content">

            <div class="logo-circle">
                <img src="logo.png.png" alt="PCI Logo">
            </div>

            <h1>News</h1>

            <p>
                Kolasib Presbytery Inkhawmpui Vawi 12-na
            </p>

        </div>

    </header>


    <!-- News Header -->
    <section class="programme-header">

        <div class="theme-card">

            <h3>📰 Latest News & Updates</h3>

            <p>
                Latest announcements, updates and important information
                from the Kolasib Presbytery Inkhawmpui Vawi 12-na.
            </p>

        </div>

    </section>


    <!-- News List -->
    <main class="news-page-container">

        <div id="newsPageList">

            <div class="home-news-empty">
                <p>Loading news...</p>
            </div>

        </div>

    </main>


<!-- News Photo Viewer -->
<div id="newsPhotoViewer" class="news-photo-viewer" aria-hidden="true">
    <button
        type="button"
        class="news-viewer-close"
        id="closeNewsViewer"
        aria-label="Close image viewer"
    >&times;</button>

    <div class="news-viewer-content">
        <img id="newsViewerImage" src="" alt="News photograph">

        <div class="news-viewer-actions">
            <a
                id="downloadNewsImage"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                download
            >⬇ Download Image</a>
        </div>
    </div>
</div>

<script type="module" src="news.js"></script>

    <script type="module" src="news.js"></script>

</body>

</html>
