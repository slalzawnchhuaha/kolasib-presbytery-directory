<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organising Committee</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero small-hero">

  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
  </div>

  <div class="hero-content">
    <div class="logo-circle">
      <img src="logo.png.png" alt="PCI Logo">
    </div>

    <h1>Organising Committee</h1>
    <p>Tumpui Kohhran</p>
  </div>

</header>

<section class="programme-header">
  <div class="theme-card">
    <h3>Photo Gallery</h3>
    <p>Organising Committee, Tumpui Kohhran</p>
  </div>
</section>

<main id="committeeGallery" class="committee-gallery"></main>

<div id="lightbox" class="lightbox">

  <span class="close-lightbox">&times;</span>

  <div class="lightbox-top">

    <span id="photoCounter">1 / 1</span>

    <div class="lightbox-actions">

      <button id="shareBtn">📤</button>
      <a id="downloadBtn" download>⬇️</a>

    </div>

  </div>

  <button class="nav-btn prev-btn">❮</button>

  <img id="lightboxImg" alt="Photo">

  <button class="nav-btn next-btn">❯</button>

</div>

<script src="organising-committee.js"></script>

</body>
</html>
