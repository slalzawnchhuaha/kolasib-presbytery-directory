<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Parking Area | Kolasib Presbytery</title>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero small-hero">

  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
  </div>

  <div class="hero-content">
    <div class="logo-circle">
      <img src="logo.png.png" alt="PCI Logo">
    </div>

    <h1>Parking Area</h1>
    <p>Kolasib Presbytery Vawi 12-na</p>
  </div>

</header>

<section class="parking-page">

  <div class="map-card">

    <h2>Parking Layout</h2>

    <p>Tap a parking pin below.</p>

    <div class="parking-map-container">

      <img src="parking-map.jpg" class="parking-map" alt="Parking Map">

      <button class="map-pin pin1" onclick="jumpTo('parking1')">1</button>
      <button class="map-pin pin2" onclick="jumpTo('parking2')">2</button>
      <button class="map-pin pin3" onclick="jumpTo('parking3')">3</button>
      <button class="map-pin pin4" onclick="jumpTo('parking4')">4</button>
      <button class="map-pin pin5" onclick="jumpTo('parking5')">5</button>
      <button class="map-pin pin6" onclick="jumpTo('parking6')">6</button>
      <button class="map-pin pin7" onclick="jumpTo('parking7')">7</button>
      <button class="map-pin pin8" onclick="jumpTo('parking8')">8</button>
      <button class="map-pin reserve" onclick="jumpTo('reserve')">R</button>

    </div>

  </div>

  <div id="parkingCards"></div>

</section>

<script type="module" src="parking.js"></script>

</body>
</html>
